name: Software checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python -m pip install uv==0.11.33
      - run: uv sync --frozen
      - run: make lint
      - run: make test
      - run: make eval-demo
      - run: make integration-test
      - run: uv build
      - run: make check-publication
      - name: Scan committed source for secrets
        run: |
          mkdir -p .runtime/publication-tree
          git archive HEAD | tar -x -C .runtime/publication-tree
          docker run --rm -v "$PWD/.runtime/publication-tree:/src:ro" ghcr.io/gitleaks/gitleaks:v8.30.1 dir /src --redact --no-banner
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: test-and-eval-evidence
          path: |
            .runtime/test-results.xml
            .runtime/integration.xml
            .runtime/eval-demo.json
  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python -m pip install uv==0.11.33
      - run: uv sync --frozen
      - run: make demo
      - run: make smoke
      - run: docker compose restart app worker
      - run: docker compose up -d --wait --wait-timeout 120
      - run: make smoke
      - run: docker compose down
        if: always()
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: demo-smoke-evidence
          path: .runtime/smoke.json
