[project]
name = "ai-office"
version = "0.1.0a0"
description = "Local-first executive workflows and evidence-based business transparency"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.127,<1",
  "uvicorn>=0.40,<1",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "sqlalchemy>=2.0,<2.1",
  "alembic>=1.16,<2",
  "httpx>=0.28,<0.29",
  "jinja2>=3.1.6,<4",
  "python-multipart>=0.0.20",
  "qdrant-client==1.16.2",
  "langchain-core>=1.2.5,<2",
  "langchain-ollama>=1.0.1,<2",
  "langchain-qdrant>=1.1.0,<2",
  "crewai==1.15.20",
  "pyyaml>=6,<7",
]
[dependency-groups]
dev = ["pytest>=9,<10", "pytest-cov>=6,<8", "ruff>=0.12", "mypy>=1.16", "types-PyYAML", "pip-audit>=2.9", "playwright>=1.55"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["app"]
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires real Qdrant server", "local_llm: requires explicitly configured local models"]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]
[tool.mypy]
python_version = "3.11"
files = ["app/contracts.py", "app/config.py", "app/metrics.py"]
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true
